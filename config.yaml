# Конфигурация monitoring_checker

# Модель Claude для анализа документов
model: claude-sonnet-4-5

# Максимальный размер загружаемого файла (МБ)
max_file_size_mb: 50

# Ключевые слова для поиска строки заголовка в Excel-отчетах (первые 30 строк)
header_keywords:
  - бин
  - заемщик
  - договор
  - сумма
  - целев
  - дата
  - кредит
  - адрес
  - контрагент

# OCR: языки Tesseract
ocr_languages: rus+eng+kaz
# Разрешение при OCR страниц PDF
ocr_dpi: 300
# Если на странице PDF меньше этого числа символов текста — считаем сканом и делаем OCR
pdf_text_min_chars: 50

# Кэш внешних запросов (часы)
cache_ttl_hours: 72

# Колонки утвержденного итогового шаблона (FR-9).
# ЗАПОЛНИТЬ после получения точного перечня от пользователя (см. Открытый вопрос №1 в PRD).
template_columns:
  - "№"
  - "Банк"
  - "БИН заемщика"
  - "Наименование заемщика"
  - "Номер кредитного договора"
  - "Дата кредитного договора"
  - "Сумма кредита"
  - "Цель кредита"
  - "Адрес реализации проекта"
  - "Регион"
  - "Дата мониторинга"
  - "Подтвержденная сумма целевого использования"
  - "Вывод о целевом использовании"
  - "Контрагенты"
  - "Прочие замечания"

# Переключатели внешних проверок (могут быть переопределены в UI)
external_checks:
  gis2_enabled: true      # 2ГИС — проверка адресов (нужен API-ключ)
  kgd_enabled: true       # КГД — формат БИН контрагентов
  statgov_enabled: false  # stat.gov — опционально, отключено по умолчанию
